---
layout: default
title: Search
permalink: /search/
no_ads: true
---

<section class="container" style="max-width: 900px; margin: 40px auto 0;">
  <h1 style="text-align: center; margin-bottom: 24px;">Search Articles</h1>

  <form class="search-form" action="{{ '/search/' | relative_url }}" method="get" role="search" style="max-width: 600px; margin: 0 auto 32px; position: relative;">
    <input type="search" name="q" id="searchInput" placeholder="Search by title, tags, or keyword..." aria-label="Search" style="width: 100%; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 999px; color: var(--text-primary); padding: 14px 48px 14px 18px; font-size: 1rem; outline: none; box-sizing: border-box;" />
    <button type="submit" aria-label="Search" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); border: none; background: transparent; color: var(--text-muted); cursor: pointer; font-size: 1.1rem;">🔍</button>
  </form>

  <div id="search-results" aria-live="polite"></div>
</section>

<script>
  const searchParams = new URLSearchParams(window.location.search);
  const query = (searchParams.get('q') || '').trim().toLowerCase();
  document.getElementById('searchInput').value = searchParams.get('q') || '';
  const resultsContainer = document.getElementById('search-results');

  const allPosts = [
    {% for post in site.posts %}
      {
        title: {{ post.title | jsonify }},
        url: {{ post.url | relative_url | jsonify }},
        excerpt: {{ post.excerpt | strip_html | strip_newlines | jsonify }},
        category: {{ post.content_path | jsonify }},
        content: {{ post.content | strip_html | strip_newlines | jsonify }}
      }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];

  function highlightMatch(text, query) {
    if (!query) return text;
    const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'ig');
    return text.replace(regex, '<mark>$1</mark>');
  }

  function renderResults(items) {
    if (!query) {
      resultsContainer.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Type something to search articles.</p>';
      return;
    }

    if (!items.length) {
      resultsContainer.innerHTML = '<p style="text-align: center; color: var(--text-muted);">No results found for <strong>"' + query + '"</strong>.</p>';
      return;
    }

    resultsContainer.innerHTML = '<div style="display: grid; gap: 16px;">' + items.map(item => {
      return `
        <article style="padding: 20px; border: 1px solid var(--border-light); border-radius: 12px; background: var(--card-bg);">
          <p style="margin: 0 0 8px; color: var(--accent-primary); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.08em;">${item.category || 'Article'}</p>
          <h2 style="margin: 0 0 8px; font-size: 1.4rem;"><a href="${item.url}" style="color: var(--text-primary); text-decoration: none;">${highlightMatch(item.title, query)}</a></h2>
          <p style="margin: 0; color: var(--text-muted); line-height: 1.7;">${highlightMatch((item.excerpt || item.content || '').slice(0, 220), query)}...</p>
        </article>
      `;
    }).join('') + '</div>';
  }

  const filtered = allPosts.filter(post => {
    const searchable = [
      post.title,
      post.excerpt,
      post.category,
      post.content
    ].join(' ').toLowerCase();

    return searchable.includes(query);
  });

  renderResults(filtered);
</script>
